spring.application.name=skyrim-emporium-api
spring.datasource.url=jdbc:mysql://localhost:3306/skyrimemporium?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-ttl=PT15M
security.jwt.refresh-token-ttl=PT8H
security.jwt.refresh-cookie-secure=false
springdoc.swagger-ui.path=/swagger-ui.html
server.port=8081